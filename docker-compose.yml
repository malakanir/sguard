name: sguard

# Tiga service dari PRD bagian 11: PostgreSQL (data utama), Floci (emulator AWS), Mailpit (SMTP lokal, Lapis 3).
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sguard}
      POSTGRES_DB: ${POSTGRES_DB:-sguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sguard} -d ${POSTGRES_DB:-sguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  floci:
    # Image resmi Floci (diverifikasi: container floci/floci berjalan di port 4566).
    image: ${FLOCI_IMAGE:-floci/floci:latest}
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - ./data/floci:/app/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI untuk melihat email verifikasi

volumes:
  pgdata:
